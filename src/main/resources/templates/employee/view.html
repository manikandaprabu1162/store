<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
<div class="container">
    <!-- Header Section -->
    <div class="header">
        <h1><i class="fas fa-user-circle"></i> Employee Details</h1>
        <div class="header-actions">
            <a th:href="@{/employees}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to List
            </a>
            <a th:href="@{/employees/edit/{id}(id=${employee.id})}" class="btn btn-warning">
                <i class="fas fa-edit"></i> Edit
            </a>
            <a th:href="@{/employees/delete/{id}(id=${employee.id})}"
               class="btn btn-danger"
               onclick="return confirm('Are you sure you want to delete this employee?')">
                <i class="fas fa-trash"></i> Delete
            </a>
        </div>
    </div>

    <!-- Employee Details -->
    <div class="view-container">
        <div class="profile-header">
            <div class="profile-avatar">
                <i class="fas fa-user-circle fa-5x"></i>
            </div>
            <div class="profile-info">
                <h2 th:text="${employee.fullName}">John Doe</h2>
                <p class="profile-position" th:text="${employee.position}">Developer</p>
                <p class="profile-department" th:text="${employee.department}">Engineering</p>
            </div>
        </div>

        <div class="details-grid">
            <div class="detail-card">
                <div class="detail-label">
                    <i class="fas fa-envelope"></i> Email
                </div>
                <div class="detail-value">
                    <a th:href="'mailto:' + ${employee.email}" th:text="${employee.email}">john@example.com</a>
                </div>
            </div>

            <div class="detail-card">
                <div class="detail-label">
                    <i class="fas fa-phone"></i> Phone
                </div>
                <div class="detail-value" th:text="${employee.phone != null ? employee.phone : 'N/A'}">
                    +1 234 567 8900
                </div>
            </div>

            <div class="detail-card">
                <div class="detail-label">
                    <i class="fas fa-dollar-sign"></i> Salary
                </div>
                <div class="detail-value salary">
                    $<span th:text="${#numbers.formatDecimal(employee.salary, 0, 2)}">50,000.00</span>
                </div>
            </div>

            <div class="detail-card">
                <div class="detail-label">
                    <i class="fas fa-calendar"></i> Hire Date
                </div>
                <div class="detail-value" th:text="${#temporals.format(employee.hireDate, 'MMMM dd, yyyy')}">
                    January 01, 2024
                </div>
            </div>

            <div class="detail-card">
                <div class="detail-label">
                    <i class="fas fa-home"></i> Address
                </div>
                <div class="detail-value" th:text="${employee.address != null ? employee.address : 'N/A'}">
                    123 Main St, City, State
                </div>
            </div>

            <div class="detail-card">
                <div class="detail-label">
                    <i class="fas fa-clock"></i> Created At
                </div>
                <div class="detail-value" th:text="${#temporals.format(employee.createdAt, 'MMM dd, yyyy HH:mm')}">
                    Jan 01, 2024 10:30
                </div>
            </div>

            <div class="detail-card">
                <div class="detail-label">
                    <i class="fas fa-clock"></i> Updated At
                </div>
                <div class="detail-value" th:text="${#temporals.format(employee.updatedAt, 'MMM dd, yyyy HH:mm')}">
                    Jan 01, 2024 10:30
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
