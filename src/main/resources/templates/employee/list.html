<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
<div class="container">
    <!-- Header Section -->
    <div class="header">
        <h1><i class="fas fa-users"></i> Employee Management</h1>
        <div class="header-actions">
            <a th:href="@{/employees/create}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Add New Employee
            </a>
        </div>
    </div>

    <!-- Success Message -->
    <div th:if="${success}" class="alert alert-success">
        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
    </div>

    <!-- Error Message -->
    <div th:if="${error}" class="alert alert-danger">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <!-- Search and Stats -->
    <div class="search-section">
        <div class="stats">
            <span class="badge"><i class="fas fa-user"></i> Total Employees: <span th:text="${employeeCount}">0</span></span>
        </div>
        <form th:action="@{/employees}" method="get" class="search-form">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" name="keyword" placeholder="Search by name..."
                       th:value="${keyword}" class="search-input">
                <button type="submit" class="btn btn-search">
                    <i class="fas fa-search"></i> Search
                </button>
                <a th:href="@{/employees}" class="btn btn-clear" th:if="${keyword != null}">
                    <i class="fas fa-times"></i> Clear
                </a>
            </div>
        </form>
    </div>

    <!-- Employee Table -->
    <div class="table-container">
        <table class="employee-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Position</th>
                <th>Salary</th>
                <th>Hire Date</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="employee : ${employees}" th:object="${employee}">
                <td><span class="id-badge" th:text="*{id}">1</span></td>
                <td>
                    <div class="employee-name">
                        <i class="fas fa-user-circle"></i>
                        <span th:text="*{fullName}">John Doe</span>
                    </div>
                </td>
                <td>
                    <a th:href="'mailto:' + *{email}" class="email-link" th:text="*{email}">
                        john@example.com
                    </a>
                </td>
                <td><span class="department-badge" th:text="*{department}">Engineering</span></td>
                <td th:text="*{position != null ? position : 'N/A'}">Developer</td>
                <td class="salary">$<span th:text="*{#numbers.formatDecimal(salary, 0, 2)}">50,000.00</span></td>
                <td th:text="*{#temporals.format(hireDate, 'MMM dd, yyyy')}">Jan 01, 2024</td>
                <td>
                    <div class="action-buttons">
                        <a th:href="@{/employees/view/{id}(id=*{id})}"
                           class="btn btn-sm btn-info" title="View">
                            <i class="fas fa-eye"></i>
                        </a>
                        <a th:href="@{/employees/edit/{id}(id=*{id})}"
                           class="btn btn-sm btn-warning" title="Edit">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a th:href="@{/employees/delete/{id}(id=*{id})}"
                           class="btn btn-sm btn-danger"
                           title="Delete"
                           onclick="return confirm('Are you sure you want to delete this employee?')">
                            <i class="fas fa-trash"></i>
                        </a>
                    </div>
                </td>
            </tr>
            <tr th:if="${employees.isEmpty()}">
                <td colspan="8" class="text-center empty-state">
                    <i class="fas fa-users fa-3x"></i>
                    <p>No employees found</p>
                    <a th:href="@{/employees/create}" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add your first employee
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
